<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удаление фона с фото - Background Remover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 Удаление фона с фотографий</h1>
            <p class="subtitle">Загрузите фото и получите изображение без фона за секунды</p>
        </header>

        <main>
            <div class="upload-section" id="uploadSection">
                <div class="upload-area" id="uploadArea">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <h2>Перетащите фото сюда</h2>
                    <p>или</p>
                    <button class="upload-btn" id="uploadBtn">Выберите файл</button>
                    <input type="file" id="fileInput" accept="image/*" hidden>
                    <p class="file-info">Поддерживаются: JPG, PNG, WebP</p>
                </div>
            </div>

            <div class="processing-section hidden" id="processingSection">
                <div class="loader-container">
                    <div class="loader"></div>
                    <p class="processing-text">Обработка изображения...</p>
                    <p class="processing-subtext">Это может занять несколько секунд</p>
                </div>
            </div>

            <div class="result-section hidden" id="resultSection">
                <div class="comparison-container">
                    <div class="image-box">
                        <h3>Оригинал</h3>
                        <div class="image-wrapper">
                            <img id="originalImage" alt="Оригинальное изображение">
                        </div>
                    </div>
                    <div class="image-box">
                        <h3>Без фона</h3>
                        <div class="image-wrapper checkerboard">
                            <img id="resultImage" alt="Изображение без фона">
                        </div>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button class="btn btn-primary" id="downloadBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Скачать PNG
                    </button>
                    <button class="btn btn-secondary" id="newImageBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <polyline points="1 4 1 10 7 10"></polyline>
                            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                        </svg>
                        Загрузить новое фото
                    </button>
                </div>
            </div>
        </main>

        <footer>
            <p>✨ Быстрое и качественное удаление фона с изображений</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
