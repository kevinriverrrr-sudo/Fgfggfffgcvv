<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRocket - Temp Email</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="18" fill="url(#gradient)" stroke="#fff" stroke-width="2"/>
                    <path d="M20 8L24 18H16L20 8Z" fill="white"/>
                    <path d="M20 12L22 20L18 20L20 12Z" fill="white"/>
                    <path d="M16 22L18 28L22 28L24 22H16Z" fill="white"/>
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" style="stop-color:#667eea"/>
                            <stop offset="100%" style="stop-color:#764ba2"/>
                        </linearGradient>
                    </defs>
                </svg>
                <h1>XRocket</h1>
            </div>
            <p class="subtitle">Временная почта</p>
        </div>

        <div class="email-section">
            <div id="emailDisplay" class="email-display">
                <span class="placeholder">Нажмите "Получить почту"</span>
            </div>
            <div class="email-actions">
                <button id="generateBtn" class="btn btn-primary">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M15 10L10 5L5 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M10 5V15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Получить почту
                </button>
                <button id="copyBtn" class="btn btn-secondary" disabled>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <rect x="6" y="6" width="10" height="10" stroke="currentColor" stroke-width="2" fill="none"/>
                        <path d="M4 4V14H14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <button id="refreshBtn" class="btn btn-secondary" disabled>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M15 10C15 7.24 12.76 5 10 5C7.24 5 5 7.24 5 10C5 12.76 7.24 15 10 15C11.38 15 12.64 14.44 13.54 13.54" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
                        <path d="M13 15L15 13L17 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
        </div>

        <div id="inboxSection" class="inbox-section" style="display: none;">
            <div class="inbox-header">
                <h2>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <rect x="3" y="5" width="14" height="10" stroke="currentColor" stroke-width="2" fill="none"/>
                        <path d="M3 7L10 12L17 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Входящие
                </h2>
                <span id="emailCount" class="email-count">0</span>
            </div>
            <div id="emailList" class="email-list">
                <div class="empty-inbox">
                    <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
                        <rect x="10" y="15" width="40" height="30" stroke="#ccc" stroke-width="2" fill="none" rx="2"/>
                        <path d="M10 20L30 35L50 20" stroke="#ccc" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <p>Нет писем</p>
                    <small>Письма появятся здесь автоматически</small>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>Автор: <strong>@MarkusGarantor</strong></p>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="popup.js"></script>
</body>
</html>
