<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LookSMM Auto-Fill</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>🔐 LookSMM Auto-Fill</h1>
    
    <div class="section">
      <h2>Автозаполнение</h2>
      <button id="startBtn" class="btn btn-primary">
        🚀 Начать автозаполнение
      </button>
    </div>

    <div class="section">
      <h2>Telegram + Аккаунт</h2>
      <label for="telegramLink" class="input-label">Ссылка Telegram:</label>
      <input type="text" id="telegramLink" class="input-field" placeholder="https://t.me/username">
      <button id="telegramAccountBtn" class="btn btn-telegram">
        📱 Telegram + Account
      </button>
    </div>

    <div class="section">
      <h2>VK + Аккаунт</h2>
      <label for="vkLink" class="input-label">Ссылка VK:</label>
      <input type="text" id="vkLink" class="input-field" placeholder="https://vk.com/username">
      <button id="vkAccountBtn" class="btn btn-vk">
        👥 VK + Account
      </button>
    </div>

    <div class="section">
      <h2>Управление аккаунтом</h2>
      <button id="logoutBtn" class="btn btn-warning">
        🚪 Выход из аккаунта
      </button>
    </div>

    <div class="section">
      <h2>История аккаунтов</h2>
      <div id="accountsList" class="accounts-list"></div>
      <button id="exportBtn" class="btn btn-success">
        💾 Экспортировать в файл
      </button>
      <button id="clearBtn" class="btn btn-danger">
        🗑️ Очистить историю
      </button>
    </div>

    <div class="section">
      <h2>Статистика</h2>
      <div id="stats" class="stats">
        <p>Всего аккаунтов: <span id="totalAccounts">0</span></p>
        <p>Последний создан: <span id="lastCreated">Нет данных</span></p>
      </div>
    </div>

    <div id="notification" class="notification hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
